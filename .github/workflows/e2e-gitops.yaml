name: Run SAST, Build, Scan, and Update Deployment

on:
  push:
    branches:
      - main

jobs:

  sonarqube_sast_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_push_image:
    runs-on: ubuntu-latest
    needs: sonarqube_sast_scan
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: |
          VERSION=$(($(cat version.txt) + 1))
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push
        run: |
          docker build -t docker.io/thegoutham/supermariogitopsproject:${{ steps.version.outputs.version }} .
          docker push docker.io/thegoutham/supermariogitopsproject:${{ steps.version.outputs.version }}

  scan_image:
    runs-on: ubuntu-latest
    needs: build_push_image

    steps:
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: docker.io/thegoutham/supermariogitopsproject:${{ needs.build_push_image.outputs.version }}
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  update_k8s:
    runs-on: ubuntu-latest
    needs: scan_image

    steps:
      - uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

      - name: Update YAML
        run: |
          VERSION=${{ needs.build_push_image.outputs.version }}
          sed -i "s|image: thegoutham/supermariogitopsproject:.*$|image: thegoutham/supermariogitopsproject:${VERSION}|" deployment.yaml
          echo $VERSION > version.txt

          git add deployment.yaml version.txt
          git commit -m "Update image tag to ${VERSION}" || echo "No changes"
          git push