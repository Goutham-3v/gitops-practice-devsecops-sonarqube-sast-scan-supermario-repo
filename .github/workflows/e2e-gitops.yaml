name: Run SAST, Build, Scan, and Deploy Latest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  sonarqube_sast_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_scan_push:
    runs-on: ubuntu-latest
    needs: sonarqube_sast_scan

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t thegoutham/supermariogitopsproject:latest .

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: thegoutham/supermariogitopsproject:latest
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Image
        run: docker push thegoutham/supermariogitopsproject:latest