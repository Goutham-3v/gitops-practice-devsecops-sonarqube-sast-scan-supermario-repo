name: Run SAST, Build, Scan, and Update Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  sonarqube_sast_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_scan_push_image:
    runs-on: ubuntu-latest
    needs: sonarqube_sast_scan
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ✅ safer version handling
      - name: Set Version
        id: version
        run: |
          VERSION=$(($(cat version.txt 2>/dev/null || echo 0) + 1))
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Image
        run: |
          docker build -t supermario:${{ steps.version.outputs.version }} .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: supermario:${{ steps.version.outputs.version }}
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Tag and Push Image
        run: |
          docker tag supermario:${{ steps.version.outputs.version }} docker.io/thegoutham/supermariogitopsproject:${{ steps.version.outputs.version }}
          docker push docker.io/thegoutham/supermariogitopsproject:${{ steps.version.outputs.version }}

  update_k8s:
    runs-on: ubuntu-latest
    needs: build_scan_push_image

    steps:
      - uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Update Deployment YAML and Push
        run: |
          VERSION=${{ needs.build_scan_push_image.outputs.version }}

          echo "----- BEFORE -----"
          cat deployment.yaml

          # ✅ robust replacement (fixes your main bug)
          sed -i "s|\(image:.*supermariogitopsproject:\).*|\1${VERSION}|" deployment.yaml

          echo "----- AFTER -----"
          cat deployment.yaml

          echo $VERSION > version.txt

          git add deployment.yaml version.txt

          # ✅ commit only if changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image tag to ${VERSION}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi